# Packaging metadata for the LEGACY Python 1.5.0 engine.
#
# The shipping application is Rust + Tauri — see Cargo.toml and package.json.
# This file remains so the reference engine stays installable for the parity
# harnesses in tools/parity/, which import utils.py and constants.py directly.
[project]
name = "autotidy-legacy-engine"
version = "1.5.0"
description = "Reference implementation of the AutoTidy engine, used to differential-test the Rust port."
requires-python = ">=3.10"
dependencies = [
    "Send2Trash>=1.8.0,<2.0.0",
]

# Only needed to run the retired PyQt6 GUI; the parity harness does not import it.
[project.optional-dependencies]
gui = ["PyQt6>=6.5.0,<7.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
