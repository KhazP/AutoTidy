# Guards the legacy Python 1.5.0 engine.
#
# It is no longer shipped — see .github/workflows/rust.yml for the app that is.
# It is kept because the parity harnesses in tools/parity/ diff the Rust engine
# against it, which makes it the executable specification for the port. If it
# breaks, the thing verifying the rewrite is broken.
name: Reference engine (Python 1.5.0)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: legacy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run test suite
        working-directory: legacy
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest --maxfail=1 --disable-warnings --cov=. --cov-report=term-missing
