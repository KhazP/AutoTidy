[package]
name = "autotidy-app"
description = "AutoTidy — automated file organisation for Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri v2 builds the app as a library so the same entry point serves desktop
# and (potentially) mobile targets.
name = "autotidy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AutoTidy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
autotidy-core = { path = "../crates/autotidy-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `preview_rule` stamps template placeholders with today's date, exactly as an
# real action would, so a preview shows the path a file would actually land in.
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Desktop-only plugins. `single-instance` is what closes the config race in
# 1.5.0: `--add-folder` spawned a second process that wrote config.json while
# the running app held a stale copy and clobbered it on quit.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# Named mutexes, for the context-menu fast path in `named_mutex`: one marks a
# live GUI instance, the other serialises config read-modify-writes between
# processes. `windows-registry` cannot express either, and the whole point of
# the fast path is to answer both questions before any heavier machinery loads.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
